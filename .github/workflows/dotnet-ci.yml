name: .NET CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Install .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download dependencies
        run: dotnet restore Products.sln

      - name: Build project
        run: dotnet build Products.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Products.sln --configuration Release --no-build --verbosity normal
